# Limine Configuration File
# Omi x86_64

# Timeout before autoboot (seconds)
# instant boot - no countdown
timeout: 0

# Default boot entry
default_entry: 1

# ==========================================
# Omi x86_64
# ==========================================

/Omi
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path: boot():/apps/init.elf
    module_path: boot():/apps/cat.elf
    module_path: boot():/apps/httpget.elf
    module_path: boot():/apps/polltest.elf
    module_path: boot():/apps/spin.elf
    module_path: boot():/apps/pipetest.elf
    module_path: boot():/apps/linuxtest.elf
    module_path: boot():/apps/muslhello.elf
    module_path: boot():/apps/muslthreads.elf
    module_path: boot():/apps/muslstat.elf
    module_path: boot():/apps/muslfork.elf
    module_path: boot():/apps/cowlives.elf
    module_path: boot():/apps/libprobe.elf
    module_path: boot():/apps/libmap.elf
    module_path: boot():/apps/dyntest.elf
    module_path: boot():/apps/exectest.elf
    module_path: boot():/apps/exectarget.elf
    module_path: boot():/apps/epolltest.elf
    module_path: boot():/apps/memfdtest.elf
    module_path: boot():/apps/socktest.elf
    module_path: boot():/lib/libgreet.so
    module_path: boot():/lib/ld-musl-x86_64.so.1
    module_path: boot():/media/sample.mp3
    module_path: boot():/media/sample.mp4
    module_path: boot():/fonts/Bricolage.ttf
    module_path: boot():/fonts/JBMono.ttf
